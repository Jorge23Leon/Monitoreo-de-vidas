<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <link rel="stylesheet" href="leaflet.css">
  <style>
    html,body,#map{height:100%;margin:0}
    .leaflet-control-attribution{font-size:9px}
    .ciagro-point-number{background:transparent!important;border:0!important;box-shadow:none!important;color:#fff!important;font:900 10px/18px system-ui,sans-serif!important;text-shadow:0 1px 2px #000,0 0 2px #000}
    .ciagro-point-number:before{display:none!important}
    .ciagro-pe-wrapper{background:transparent!important;border:0!important}
    .ciagro-pe-marker{position:relative;width:34px;height:39px;font-family:system-ui,-apple-system,sans-serif}
    .ciagro-pe-labels{position:absolute;top:-1px;left:0;width:34px;display:flex;justify-content:space-around;font-size:10px;line-height:12px;font-weight:900;color:#111;text-shadow:0 1px 2px #fff,0 0 2px #fff;z-index:3}
    .ciagro-pe-circle{position:absolute;left:2px;top:9px;width:30px;height:30px;border-radius:50%;overflow:hidden;border:3px solid #0b5a2a;box-sizing:border-box;background:#fff;box-shadow:0 1px 4px #0006}
    .ciagro-pe-half{position:absolute;top:0;height:100%;width:50%}
    .ciagro-pe-pest{left:0}.ciagro-pe-disease{right:0}
    .ciagro-pe-divider{position:absolute;left:50%;top:0;width:2px;height:100%;background:#111;transform:translateX(-1px);z-index:2}
    .ciagro-pe-point-number{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;color:#fff;font-size:9px;font-weight:900;text-shadow:0 1px 2px #000,0 0 2px #000;pointer-events:none}
  </style>
</head>
<body>
<div id="map"></div>
<script src="leaflet.js"></script>
<script>
const map=L.map('map',{zoomSnap:.25,zoomDelta:.5}).setView([21.12,-101.68],13);
map.getContainer().style.background='#dfe8db';
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxNativeZoom:18,maxZoom:20,updateWhenZooming:false,updateWhenIdle:true,keepBuffer:4,attribution:'Tiles © Esri'}).addTo(map);
L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxNativeZoom:18,maxZoom:20,updateWhenZooming:false,updateWhenIdle:true,keepBuffer:4,attribution:'Labels © Esri',opacity:.72}).addTo(map);

let layers=[],interactive=false,pointInteractive=false;
function clear(){layers.forEach(x=>{try{map.removeLayer(x)}catch(_){}});layers=[]}
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}

function phytoIcon(p){
  const pest=p.pestColor||'#9ca3af', disease=p.diseaseColor||'#9ca3af', number=esc(p.markerText||'');
  const html='<div class="ciagro-pe-marker"><div class="ciagro-pe-labels"><span>P</span><span>E</span></div><div class="ciagro-pe-circle"><div class="ciagro-pe-half ciagro-pe-pest" style="background:'+esc(pest)+'"></div><div class="ciagro-pe-half ciagro-pe-disease" style="background:'+esc(disease)+'"></div><div class="ciagro-pe-divider"></div>'+(number?'<div class="ciagro-pe-point-number">'+number+'</div>':'')+'</div></div>';
  return L.divIcon({className:'ciagro-pe-wrapper',html,iconSize:[34,39],iconAnchor:[17,27],tooltipAnchor:[0,-18]});
}
function colorRank(c){
  const v=String(c||'').toLowerCase();
  if(v==='#d82424'||v==='#dc2626'||v==='#ef4444')return 3;
  if(v==='#ff7a00'||v==='#f97316'||v==='#fb923c')return 2;
  if(v==='#ffc107'||v==='#facc15'||v==='#fbbf24')return 1;
  return 0;
}
function heatValue(p,index){
  const rank=index==='disease'?colorRank(p.diseaseColor):colorRank(p.pestColor);
  return rank===3?.92:rank===2?.66:rank===1?.38:.08;
}
function bandColor(v){
  if(v<.18)return[22,128,61];
  if(v<.38)return[132,204,92];
  if(v<.58)return[245,238,169];
  if(v<.78)return[251,176,89];
  return[220,73,57];
}
function pointInsidePolygon(lat,lon,poly){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const yi=Number(poly[i][0]),xi=Number(poly[i][1]),yj=Number(poly[j][0]),xj=Number(poly[j][1]);
    const hit=((yi>lat)!==(yj>lat))&&(lon<((xj-xi)*(lat-yi))/((yj-yi)||Number.EPSILON)+xi);
    if(hit)inside=!inside;
  }
  return inside;
}
function idwValue(lat,lon,samples,cosLat){
  let num=0,den=0;
  for(const s of samples){
    const dx=(lon-s.lon)*cosLat,dy=lat-s.lat,d2=dx*dx+dy*dy;
    if(d2<1e-16)return s.value;
    const w=1/Math.pow(d2,.95);num+=w*s.value;den+=w;
  }
  return den?num/den:0;
}
function nearestNormalizedDistance(lat,lon,samples,w,h,cosLat){
  let nearest=Infinity;
  for(const s of samples){
    const dx=((lon-s.lon)*cosLat)/w,dy=(lat-s.lat)/h,d=Math.sqrt(dx*dx+dy*dy);
    if(d<nearest)nearest=d;
  }
  return nearest;
}
function createPhytoSurface(points,polygon,index){
  if(!polygon||polygon.length<3)return null;
  const samples=points.filter(p=>p.splitPhyto&&Number.isFinite(Number(p.lat))&&Number.isFinite(Number(p.lon))).map(p=>({lat:Number(p.lat),lon:Number(p.lon),value:heatValue(p,index)}));
  if(!samples.length)return null;
  const lats=polygon.map(p=>Number(p[0])),lons=polygon.map(p=>Number(p[1]));
  const south=Math.min(...lats),north=Math.max(...lats),west=Math.min(...lons),east=Math.max(...lons);
  if(![south,north,west,east].every(Number.isFinite))return null;
  const mid=(south+north)/2,cosLat=Math.max(.15,Math.cos(mid*Math.PI/180));
  const geoW=Math.max((east-west)*cosLat,1e-9),geoH=Math.max(north-south,1e-9);
  const cw=420,ch=Math.max(120,Math.min(520,Math.round(cw*(geoH/geoW))));
  const canvas=document.createElement('canvas');canvas.width=cw;canvas.height=ch;
  const ctx=canvas.getContext('2d');if(!ctx)return null;
  const img=ctx.createImageData(cw,ch);
  const influence=samples.length===1?.16:samples.length===2?.20:Infinity;
  for(let r=0;r<ch;r++){
    const lat=north-((r+.5)/ch)*(north-south);
    for(let c=0;c<cw;c++){
      const lon=west+((c+.5)/cw)*(east-west),o=(r*cw+c)*4;
      if(!pointInsidePolygon(lat,lon,polygon)){img.data[o+3]=0;continue}
      if(samples.length<3&&nearestNormalizedDistance(lat,lon,samples,geoW,geoH,cosLat)>influence){img.data[o+3]=0;continue}
      const rgb=bandColor(idwValue(lat,lon,samples,cosLat));
      img.data[o]=rgb[0];img.data[o+1]=rgb[1];img.data[o+2]=rgb[2];img.data[o+3]=210;
    }
  }
  ctx.putImageData(img,0,0);
  return{url:canvas.toDataURL('image/png'),bounds:[[south,west],[north,east]]};
}
map.on('click',()=>{if(interactive&&window.CiagroMapTap?.postMessage)window.CiagroMapTap.postMessage('capture')});

window.setCiagroData=function(d){
  clear();interactive=!!d.interactive;pointInteractive=!!d.pointInteractive;
  const bounds=[],points=d.points||[],polygon=d.polygon||[],visualization=d.phytoVisualization||'discs',heatIndex=d.phytoHeatIndex||'pest';
  if(visualization==='heat'&&polygon.length>2){
    const surface=createPhytoSurface(points,polygon,heatIndex);
    if(surface){const ov=L.imageOverlay(surface.url,surface.bounds,{opacity:1,interactive:false}).addTo(map);layers.push(ov)}
  }
  if(polygon.length>2){
    const poly=L.polygon(polygon,{color:'#137333',weight:4,fillColor:'#16833a',fillOpacity:visualization==='heat'?.025:.22}).addTo(map);
    layers.push(poly);bounds.push(...polygon);
  }
  points.forEach(p=>{
    let m;
    if(d.ndvi){
      m=L.circleMarker([p.lat,p.lon],{radius:5,color:'#1a9850',fillColor:'#1a9850',fillOpacity:.9});
    }else if(p.splitPhyto&&visualization==='heat'){
      m=L.circleMarker([p.lat,p.lon],{radius:3.5,color:'#fff',weight:1.2,fillColor:'#101010',fillOpacity:1});
    }else if(p.splitPhyto){
      m=L.marker([p.lat,p.lon],{icon:phytoIcon(p)});
    }else{
      const c=p.markerColor||'#17863a';m=L.circleMarker([p.lat,p.lon],{radius:10,color:'#0d5b29',weight:3,fillColor:c,fillOpacity:1});
    }
    m.addTo(map);
    let popup=p.label||'';
    if(p.splitPhyto)popup=(p.markerText?'Punto '+esc(p.markerText):'Punto')+'<br>P · '+esc(p.pestText||'Sin evaluar')+'<br>E · '+esc(p.diseaseText||'Sin evaluar');
    if(popup)m.bindPopup(popup);
    if(p.splitPhyto&&visualization!=='heat'){
      m.bindTooltip((p.markerText?'Punto '+esc(p.markerText):'Punto')+'<br>P · '+esc(p.pestText||'Sin evaluar')+'<br>E · '+esc(p.diseaseText||'Sin evaluar'),{permanent:false,direction:'top',opacity:.97});
    }else if(!d.ndvi&&!p.splitPhyto&&p.markerText){
      m.bindTooltip(String(p.markerText),{permanent:true,direction:'center',className:'ciagro-point-number',opacity:1});
    }
    if(pointInteractive&&p.id!=null){
      m.on('click',e=>{
        if(e?.originalEvent){L.DomEvent.stopPropagation(e.originalEvent);L.DomEvent.preventDefault(e.originalEvent)}
        if(window.CiagroPointTap?.postMessage)window.CiagroPointTap.postMessage(String(p.id));
      });
    }
    layers.push(m);bounds.push([p.lat,p.lon]);
  });
  const u=d.currentLocation;
  if(u&&Number.isFinite(u.lat)&&Number.isFinite(u.lon)){
    const accuracy=Math.max(0,Number(u.accuracy)||0);
    if(accuracy>0){const c=L.circle([u.lat,u.lon],{radius:accuracy,color:'#1565c0',weight:1,fillOpacity:.06}).addTo(map);layers.push(c)}
    const me=L.circleMarker([u.lat,u.lon],{radius:8,color:'#0d47a1',weight:3,fillColor:'#2196f3',fillOpacity:1}).addTo(map);
    me.bindPopup((u.label||'Tu ubicación')+(accuracy?' · precisión '+Math.round(accuracy)+' m':''));layers.push(me);bounds.push([u.lat,u.lon]);
  }
  if(bounds.length)map.fitBounds(bounds,{padding:[24,24],maxZoom:18});
  setTimeout(()=>map.invalidateSize(),80);
}
</script>
</body>
</html>
